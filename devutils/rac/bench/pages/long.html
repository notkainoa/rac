<!doctype html>
<title>bench long page</title>
<h1>bench long page</h1>
<p>A long page for the scroll-latency step: several hundred sections so a
wheel event actually scrolls.</p>
<div id="list"></div>
<script>
  const list = document.getElementById('list');
  for (let i = 0; i < 600; i++) {
    const p = document.createElement('p');
    p.textContent = `Section ${i}: the quick brown fox jumps over the lazy dog. ` +
      'Pack my box with five dozen liquor jugs. How vexingly quick daft zebras jump!';
    list.appendChild(p);
  }
</script>
