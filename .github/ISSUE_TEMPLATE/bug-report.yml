name: Bug report
description: Something in rac is broken
labels: ["bug"]
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please search existing issues first in case it's already reported.

        Security problems should be reported privately instead. See SECURITY.md.

        rac isn't affiliated with Helium. Please don't report rac bugs to Helium.
  - type: input
    id: version
    attributes:
      label: Version
      description: Copy it from the About page in settings.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: macOS 26.1, MacBook Pro M4
    validations:
      required: true
  - type: input
    id: description
    attributes:
      label: What's wrong?
      description: One line describing the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open '...'
        2. Click '...'
        3. See the problem
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Narrowing it down
      description: Optional, but it helps a lot.
      options:
        - label: It still happens with a new, empty profile.
        - label: It also happens in an unmodified Helium.
        - label: It doesn't happen in an unmodified Helium.
  - type: textarea
    id: additional
    attributes:
      label: Anything else
      description: Screenshots, videos, or other context.
