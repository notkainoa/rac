name: Feature request
description: Suggest an idea for rac
labels: ["feat"]
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Please read the vision (VISION.md) and roadmap (docs/roadmap.md) first. rac is opinionated, so ideas that fit the vision are the most likely to happen.

        Rough ideas are welcome too. This issue is where the conversation happens.
  - type: input
    id: description
    attributes:
      label: The idea
      description: One line describing what you'd like.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What's frustrating or missing today?
      placeholder: When I [...], I have to [...]
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: How it could work
      description: Describe the behavior you have in mind. Screenshots or references from other browsers help.
  - type: checkboxes
    id: implementing
    attributes:
      label: Who's building it?
      options:
        - label: I'd like to build this myself.
  - type: textarea
    id: additional
    attributes:
      label: Anything else
