name: Build Helium
description: Builds one phase and uploads the checkpoint, and the unsigned app once the build finishes
inputs:
  arch:
    description: arm64 or x86_64
    required: true
outputs:
  status:
    value: ${{ steps.build.outputs.status }}
runs:
  using: composite
  steps:
    - name: Show sccache stats before build
      run: sccache --show-stats
      shell: bash

    - name: Build
      id: build
      run: |
        set -o pipefail
        ./github_build.sh '${{ inputs.arch }}' 2>&1 | tee -a github_actions_build_${{ inputs.arch }}.log
      shell: bash

    - name: Show sccache stats after build
      run: sccache --show-stats
      shell: bash

    - name: Prepare archive of build as artifact
      id: bake
      run: |
        set -o pipefail
        ./github_prepare_artifacts.sh '${{ inputs.arch }}' | tee -a github_actions_upload_${{ inputs.arch }}.log
      shell: bash
    # The `sign` job in building.yml signs, notarizes and packages this.
    - name: Upload the unsigned app after build
      if: ${{ steps.build.outputs.status == 'finished' }}
      uses: actions/upload-artifact@v4
      with:
        name: rac_unsigned_app_${{ inputs.arch }}
        path: upload_app/
        # Already zstd-compressed.
        compression-level: 0
        if-no-files-found: error
        overwrite: true
    - name: Upload part build artifact
      uses: actions/upload-artifact@v4
      with:
        name: github_build_artifact_${{ inputs.arch }}
        path: upload_part_build/
        overwrite: true
    - name: Upload logs
      uses: actions/upload-artifact@v4
      with:
        name: github_build_logs_${{ inputs.arch }}
        path: upload_logs/
        overwrite: true
