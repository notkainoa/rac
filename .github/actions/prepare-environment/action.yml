name: Prepare build environment
runs:
  using: composite
  steps:
    - name: Setup Python 3.13
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    - name: Copy GitHub specific scripts to git-root folder
      run: cp -va ./.github/scripts/ ./ ; date +%s > ./epoch_job_start.txt
      shell: bash
    - name: Prepare Xcode
      run: ./github_prepare_xcode.sh
      shell: bash
    - name: Cleanup Android Related Stuff
      run: sudo rm -rf $ANDROID_HOME
      shell: bash
    - name: Disable Spotlight
      run: sudo mdutil -a -i off
      shell: bash
    - name: Expose the Actions cache to sccache
      # sccache's GitHub Actions backend reads these, but run steps don't
      # get them unless an action exports them. Helium uses its own WebDAV
      # cache instead, so upstream never hits this.
      uses: actions/github-script@v7
      with:
        script: |
          for (const [name, value] of Object.entries(process.env)) {
            if (name.startsWith('ACTIONS_') && value) core.exportVariable(name, value);
          }
          // Without this, sccache's cache library talks to the retired v1
          // cache API and GitHub answers with an error page.
          if (process.env.ACTIONS_RESULTS_URL && !process.env.ACTIONS_CACHE_SERVICE_V2) {
            core.exportVariable('ACTIONS_CACHE_SERVICE_V2', 'on');
          }
    - name: Setup Environment and Toolchain
      run: |
        set -o pipefail
        ./github_setup_env_toolchain.sh | tee -a github_actions_setup_env_toolchain.log
      shell: bash
