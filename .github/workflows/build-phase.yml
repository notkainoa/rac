name: Build Helium for macOS

defaults:
  run:
    shell: bash

permissions:
  contents: read
  # The checkpoint download falls back to `gh run download`.
  actions: read

on:
  workflow_call:
    inputs:
      arch:
        required: true
        type: string
      os:
        required: true
        type: string
      resume:
        required: false
        type: boolean
        default: false
      # 'true' when the provisioning profile secret is set. Only the first
      # phase reads it; the profile itself is used by the `sign` job.
      branded-entitlements:
        required: false
        type: string
        default: 'false'
    # Only what the compile needs. Signing and notarization secrets go to the
    # `sign` job in building.yml, never to a build runner.
    secrets:
      PROD_MACOS_SPARKLE_ED_PUB_KEY:
        required: false
    outputs:
      status:
        value: ${{ jobs.build_job.outputs.status }}

jobs:
  build_job:
    name: Build Helium for macOS
    runs-on: ${{ inputs.os }}
    outputs:
      status: ${{ steps.build.outputs.status }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/prepare-environment
      - name: Download resources
        if: ${{ !inputs.resume }}
        uses: actions/download-artifact@v4
        with:
          name: helium_macos_resources_${{ inputs.arch }}
      - name: Unpack resources
        if: ${{ !inputs.resume }}
        run: ./github_unpack_resources.sh
      - name: Prepare for building
        if: ${{ !inputs.resume }}
        run: |
          set -o pipefail
          source ./devutils/shared.sh
          configure_build '${{ inputs.arch }}' true true | tee -a github_actions_build_${{ inputs.arch }}.log
        env:
          PROD_MACOS_SPARKLE_ED_PUB_KEY: ${{ secrets.PROD_MACOS_SPARKLE_ED_PUB_KEY }}
          RAC_BRANDED_ENTITLEMENTS: ${{ inputs.branded-entitlements }}
      - name: Get previous logs
        if: ${{ inputs.resume }}
        # A hung download fails by timeout, and the next step retries it.
        timeout-minutes: 10
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: github_build_logs_${{ inputs.arch }}
      - name: Check previous logs, downloading again if needed
        if: ${{ inputs.resume }}
        timeout-minutes: 15
        # The logs artifact has no checksums. Every phase writes this file, and
        # the setup logs already in the folder can't stand in for it.
        run: ./github_download_checkpoint.sh github_build_logs_${{ inputs.arch }} --expect build_times_${{ inputs.arch }}.log
        env:
          GH_TOKEN: ${{ github.token }}
          RAC_CHECKPOINT_ATTEMPT_TIMEOUT: 300
      - name: Download build
        if: ${{ inputs.resume }}
        # A hung download fails by timeout, and the next step retries it.
        timeout-minutes: 25
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: github_build_artifact_${{ inputs.arch }}
      - name: Check build download, downloading again if needed
        if: ${{ inputs.resume }}
        timeout-minutes: 50
        run: ./github_download_checkpoint.sh github_build_artifact_${{ inputs.arch }} --sums sums.txt
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Unpack archive of build
        if: ${{ inputs.resume }}
        run: ./github_unpack_archive.sh
      - uses: ./.github/actions/do-build
        id: build
        with:
          arch: ${{ inputs.arch }}
