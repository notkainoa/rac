name: Build macOS binaries of Helium
on:
  workflow_dispatch:
    inputs:
      runner:
        required: false
        description: "Runner image name"
        default: "macos-latest"
      arches:
        required: false
        type: choice
        description: "Architectures to build: arm64 (Apple Silicon), x86_64 (Intel), or both. A release contains only these."
        options:
          - arm64
          - x86_64
          - both
        default: arm64
      do-release:
        required: false
        type: boolean
        description: "Create a release after build is done"
        default: false
      g6-gate:
        required: false
        type: choice
        description: "Developer switches (G6): warn, or enforce to fail the build when the release binaries contain them"
        options:
          - warn
          - enforce
        default: warn

permissions:
  contents: read
  # The checkpoint download falls back to `gh run download`.
  actions: read

jobs:
  build:
    name: Build macOS binaries of Helium
    strategy:
      matrix:
        arch: ${{ fromJSON(inputs.arches == 'both' && '["arm64","x86_64"]' || format('["{0}"]', inputs.arches)) }}
      # One architecture failing must not cancel the other's chain.
      fail-fast: false
      max-parallel: 2
    uses: ./.github/workflows/building.yml
    secrets: inherit
    with:
      arch: ${{ matrix.arch }}
      os: ${{ inputs.runner }}
      g6-gate: ${{ inputs.g6-gate }}

  release:
    needs: build
    name: Release macOS binaries of Helium
    # Always GitHub's own runner, like `sign` in building.yml: this job holds
    # the update signing key, which must not reach a build runner.
    runs-on: macos-latest
    if: ${{ inputs.do-release }}
    permissions:
      contents: write
    env:
      # The scripts below read this to know which disk images to expect.
      RAC_ARCHES: ${{ inputs.arches == 'both' && 'arm64 x86_64' || inputs.arches }}
    defaults:
      run:
        # The explicit shell adds pipefail, so a script that fails before
        # `tee` fails the step.
        shell: bash
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Copy GitHub specific scripts to git-root folder
        run: cp -va ./.github/scripts/ ./
      - name: Disable Spotlight
        run: sudo mdutil -a -i off
      - name: Install coreutils
        run: brew install coreutils
      - name: Prepare release
        id: bake
        run: ./github_prepare_release.sh | tee -a github_actions_release.log
      - name: Get built x86-64 binary
        if: ${{ steps.bake.outputs.x64_file_name != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.bake.outputs.x64_file_name }}
      - name: Get built arm64 binary
        if: ${{ steps.bake.outputs.arm64_file_name != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.bake.outputs.arm64_file_name }}
      - name: Generate release note
        run: ./github_generate_release_note.sh | tee -a github_actions_release.log
      - name: Write update feeds
        run: |
          set -o pipefail
          python3 -m pip install --break-system-packages cryptography
          ./github_write_appcasts.sh '${{ steps.bake.outputs.release_tag_version }}' | tee -a github_actions_release.log
        env:
          PROD_MACOS_SPARKLE_ED_PUB_KEY: ${{ secrets.PROD_MACOS_SPARKLE_ED_PUB_KEY }}
          RAC_SPARKLE_ED_PRIVATE_KEY: ${{ secrets.RAC_SPARKLE_ED_PRIVATE_KEY }}
      - name: List release files
        id: list_deltas
        run: |
          {
            echo 'deltas<<EOF'
            find ./release_asset/ -name '*.dmg' -o -name '*.delta' -o -name 'appcast-*.xml'
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: Release Helium binaries
        uses: imputnet/action-gh-release@f0aaee5ca0734029d3612cf234fbc25f261b5036 # v2.5
        with:
          body_path: ./github_release_note.md
          draft: false
          # Installed copies read the feed from releases/latest, which skips
          # prereleases.
          prerelease: false
          files: |
            ${{ steps.list_deltas.outputs.deltas }}
          name: ${{ steps.bake.outputs.release_name }}
          tag_name: ${{ steps.bake.outputs.release_tag_version }}
          # Tag the commit that was built, not wherever main is by the time
          # the build finishes.
          target_commitish: ${{ github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
