name: Building macOS binaries of Helium

defaults:
  run:
    shell: bash

permissions:
  contents: read
  # The checkpoint download falls back to `gh run download`.
  actions: read

on:
  workflow_call:
    inputs:
      arch:
        required: true
        type: string
      os:
        required: true
        type: string
      g6-gate:
        required: false
        type: string
        default: warn

jobs:
  retrieve-resources:
    name: Retrieve resources required for building
    runs-on: ${{ inputs.os }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/prepare-environment
      - name: Download and unpack required resources
        run: |
          set -o pipefail
          source ./devutils/shared.sh
          prepare_sources '${{ inputs.arch }}' false | tee -a github_actions_retrieve_resources.log
          rm -rf build/download_cache
      - name: Archive resources
        run: ./github_pack_resources.sh | tee -a github_actions_retrieve_resources.log
      - name: Upload resources
        uses: actions/upload-artifact@v4
        with:
          name: helium_macos_resources_${{ inputs.arch }}
          path: upload_build_resources/

  build_job_01:
    needs: retrieve-resources
    uses: ./.github/workflows/build-phase.yml
    secrets:
      PROD_MACOS_SPARKLE_ED_PUB_KEY: ${{ secrets.PROD_MACOS_SPARKLE_ED_PUB_KEY }}
      PROD_MACOS_SPECIAL_ENTITLEMENTS_PROFILE_B64: ${{ secrets.PROD_MACOS_SPECIAL_ENTITLEMENTS_PROFILE_B64 }}
    with:
      arch: ${{ inputs.arch }}
      os: ${{ inputs.os }}

  build_job_02:
    needs: build_job_01
    if: ${{needs.build_job_01.outputs.status == 'running'}}
    uses: ./.github/workflows/build-phase.yml
    secrets:
      PROD_MACOS_SPARKLE_ED_PUB_KEY: ${{ secrets.PROD_MACOS_SPARKLE_ED_PUB_KEY }}
      PROD_MACOS_SPECIAL_ENTITLEMENTS_PROFILE_B64: ${{ secrets.PROD_MACOS_SPECIAL_ENTITLEMENTS_PROFILE_B64 }}
    with:
      arch: ${{ inputs.arch }}
      os: ${{ inputs.os }}
      resume: true

  build_job_03:
    needs: build_job_02
    if: ${{needs.build_job_02.outputs.status == 'running'}}
    uses: ./.github/workflows/build-phase.yml
    secrets:
      PROD_MACOS_SPARKLE_ED_PUB_KEY: ${{ secrets.PROD_MACOS_SPARKLE_ED_PUB_KEY }}
      PROD_MACOS_SPECIAL_ENTITLEMENTS_PROFILE_B64: ${{ secrets.PROD_MACOS_SPECIAL_ENTITLEMENTS_PROFILE_B64 }}
    with:
      arch: ${{ inputs.arch }}
      os: ${{ inputs.os }}
      resume: true

  build_job_04:
    needs: build_job_03
    if: ${{needs.build_job_03.outputs.status == 'running'}}
    uses: ./.github/workflows/build-phase.yml
    secrets:
      PROD_MACOS_SPARKLE_ED_PUB_KEY: ${{ secrets.PROD_MACOS_SPARKLE_ED_PUB_KEY }}
      PROD_MACOS_SPECIAL_ENTITLEMENTS_PROFILE_B64: ${{ secrets.PROD_MACOS_SPECIAL_ENTITLEMENTS_PROFILE_B64 }}
    with:
      arch: ${{ inputs.arch }}
      os: ${{ inputs.os }}
      resume: true

  build_job_05:
    needs: build_job_04
    if: ${{needs.build_job_04.outputs.status == 'running'}}
    uses: ./.github/workflows/build-phase.yml
    secrets:
      PROD_MACOS_SPARKLE_ED_PUB_KEY: ${{ secrets.PROD_MACOS_SPARKLE_ED_PUB_KEY }}
      PROD_MACOS_SPECIAL_ENTITLEMENTS_PROFILE_B64: ${{ secrets.PROD_MACOS_SPECIAL_ENTITLEMENTS_PROFILE_B64 }}
    with:
      arch: ${{ inputs.arch }}
      os: ${{ inputs.os }}
      resume: true

  build_job_06:
    needs: build_job_05
    if: ${{needs.build_job_05.outputs.status == 'running'}}
    uses: ./.github/workflows/build-phase.yml
    secrets:
      PROD_MACOS_SPARKLE_ED_PUB_KEY: ${{ secrets.PROD_MACOS_SPARKLE_ED_PUB_KEY }}
      PROD_MACOS_SPECIAL_ENTITLEMENTS_PROFILE_B64: ${{ secrets.PROD_MACOS_SPECIAL_ENTITLEMENTS_PROFILE_B64 }}
    with:
      arch: ${{ inputs.arch }}
      os: ${{ inputs.os }}
      resume: true

  build_job_07:
    needs: build_job_06
    if: ${{needs.build_job_06.outputs.status == 'running'}}
    uses: ./.github/workflows/build-phase.yml
    secrets:
      PROD_MACOS_SPARKLE_ED_PUB_KEY: ${{ secrets.PROD_MACOS_SPARKLE_ED_PUB_KEY }}
      PROD_MACOS_SPECIAL_ENTITLEMENTS_PROFILE_B64: ${{ secrets.PROD_MACOS_SPECIAL_ENTITLEMENTS_PROFILE_B64 }}
    with:
      arch: ${{ inputs.arch }}
      os: ${{ inputs.os }}
      resume: true

  build_job_08:
    needs: build_job_07
    if: ${{needs.build_job_07.outputs.status == 'running'}}
    uses: ./.github/workflows/build-phase.yml
    secrets:
      PROD_MACOS_SPARKLE_ED_PUB_KEY: ${{ secrets.PROD_MACOS_SPARKLE_ED_PUB_KEY }}
      PROD_MACOS_SPECIAL_ENTITLEMENTS_PROFILE_B64: ${{ secrets.PROD_MACOS_SPECIAL_ENTITLEMENTS_PROFILE_B64 }}
    with:
      arch: ${{ inputs.arch }}
      os: ${{ inputs.os }}
      resume: true

  build_job_09:
    needs: build_job_08
    if: ${{needs.build_job_08.outputs.status == 'running'}}
    uses: ./.github/workflows/build-phase.yml
    secrets:
      PROD_MACOS_SPARKLE_ED_PUB_KEY: ${{ secrets.PROD_MACOS_SPARKLE_ED_PUB_KEY }}
      PROD_MACOS_SPECIAL_ENTITLEMENTS_PROFILE_B64: ${{ secrets.PROD_MACOS_SPECIAL_ENTITLEMENTS_PROFILE_B64 }}
    with:
      arch: ${{ inputs.arch }}
      os: ${{ inputs.os }}
      resume: true

  build_job_10:
    needs: build_job_09
    if: ${{needs.build_job_09.outputs.status == 'running'}}
    uses: ./.github/workflows/build-phase.yml
    secrets:
      PROD_MACOS_SPARKLE_ED_PUB_KEY: ${{ secrets.PROD_MACOS_SPARKLE_ED_PUB_KEY }}
      PROD_MACOS_SPECIAL_ENTITLEMENTS_PROFILE_B64: ${{ secrets.PROD_MACOS_SPECIAL_ENTITLEMENTS_PROFILE_B64 }}
    with:
      arch: ${{ inputs.arch }}
      os: ${{ inputs.os }}
      resume: true

  # Signs, notarizes and packages the app on GitHub's own runner, never on
  # inputs.os, so the Developer ID certificate and notarization credentials
  # stay on GitHub even when the compile moves to another provider. It runs
  # here, per architecture, so it starts as soon as that chain finishes, and
  # build.yml's release job, which needs `build`, still waits for it.
  sign:
    name: Sign and notarize
    needs: [retrieve-resources, build_job_01, build_job_02, build_job_03, build_job_04, build_job_05,
            build_job_06, build_job_07, build_job_08, build_job_09, build_job_10]
    # Phases after the one that finishes are skipped, so look at every phase.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: macos-latest
    # Notarization waits in Apple's queue, which can take hours on a team's
    # first submissions.
    timeout-minutes: 330
    env:
      RAC_G6_GATE: ${{ inputs.g6-gate }}
    steps:
      - name: Check that a build phase finished
        if: ${{ !contains(needs.*.outputs.status, 'finished') }}
        run: |
          echo "::error::No build phase reported a finished build; the chain ran out of phases or stopped early."
          exit 1
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Copy GitHub specific scripts to git-root folder
        run: cp -va ./.github/scripts/ ./
      - name: Disable Spotlight
        # Indexing a mounted disk image can keep hdiutil from detaching it.
        run: sudo mdutil -a -i off
      - name: Install tools
        run: |
          brew install coreutils zstd
          python3 -m pip install requests
      - name: Download the unsigned app
        # A hung download fails by timeout, and the next step retries it.
        timeout-minutes: 15
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: rac_unsigned_app_${{ inputs.arch }}
          path: unsigned
      - name: Check the download, downloading again if needed
        timeout-minutes: 30
        run: |
          mkdir -p unsigned
          cd unsigned
          ../github_download_checkpoint.sh rac_unsigned_app_${{ inputs.arch }} --sums app_sums.txt
        env:
          GH_TOKEN: ${{ github.token }}
          RAC_CHECKPOINT_ATTEMPT_TIMEOUT: 600
      - name: Unpack the app
        run: |
          set -o pipefail
          mkdir -p build/src/out/Default
          zstd -dc unsigned/rac_unsigned.tar.zst | tar -x -f - -C build/src/out/Default
          rm -rf unsigned
          # codesign refuses Finder info and resource forks.
          xattr -cs build/src/out/Default/rac.app
          ls -la build/src/out/Default
      - name: Check for developer switches (G6)
        run: ./github_check_release_binary.sh build/src/out/Default/rac.app
      - name: Sign, notarize and package
        id: sign
        run: |
          set -o pipefail
          ./github_sign_app.sh '${{ inputs.arch }}' 2>&1 | tee -a github_actions_sign_${{ inputs.arch }}.log
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MACOS_CERTIFICATE: ${{ secrets.PROD_MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.PROD_MACOS_CERTIFICATE_PWD }}
          MACOS_CERTIFICATE_NAME: ${{ secrets.PROD_MACOS_CERTIFICATE_NAME }}
          MACOS_CI_KEYCHAIN_PWD: ${{ secrets.PROD_MACOS_CI_KEYCHAIN_PWD }}
          PROD_MACOS_NOTARIZATION_APPLE_ID: ${{ secrets.PROD_MACOS_NOTARIZATION_APPLE_ID }}
          PROD_MACOS_NOTARIZATION_TEAM_ID: ${{ secrets.PROD_MACOS_NOTARIZATION_TEAM_ID }}
          PROD_MACOS_NOTARIZATION_PWD: ${{ secrets.PROD_MACOS_NOTARIZATION_PWD }}
          PROD_MACOS_SPECIAL_ENTITLEMENTS_PROFILE_B64: ${{ secrets.PROD_MACOS_SPECIAL_ENTITLEMENTS_PROFILE_B64 }}
      - name: Upload disk-image and hash file as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.sign.outputs.file_name }}
          if-no-files-found: error
          path: |
            ${{ steps.sign.outputs.deltas }}
            ./release_asset/${{ steps.sign.outputs.file_name }}
            ./${{ steps.sign.outputs.file_name }}.hashes.md
      - name: Delete the temporary keychain
        if: ${{ always() }}
        run: |
          security delete-keychain build.keychain 2>/dev/null || true
          rm -f "$RUNNER_TEMP/certificate.p12"
