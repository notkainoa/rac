name: Checks

# Cheap checks for every pull request and every push to main. None of them
# builds Chromium. All but one run on Linux; the Apple patch job needs macOS's
# /usr/bin/patch. The whole workflow should finish in well under 15 minutes.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
        persist-credentials: false
    - uses: actions/setup-python@v6
      with:
        python-version: '3.14'
    # quilt (and diffstat, which it depends on) are the only packages these
    # tests need from outside the runner image. Ubuntu's mirrors have been
    # unreachable from runners for hours at a time, so they come from, in
    # order: the runner, the Actions cache, Debian's CDN (pinned .debs,
    # checked against SHA-256), and only then apt, bounded in time.
    - name: Restore the cached quilt packages
      uses: actions/cache@v4
      with:
        path: ~/quilt-debs
        key: quilt-debs-${{ runner.os }}-${{ runner.arch }}-v2
    - name: Install quilt and the macOS tool names the tests use
      timeout-minutes: 8
      env:
        QUILT_DEB: https://deb.debian.org/debian/pool/main/q/quilt/quilt_0.67+really0.66-1_all.deb
        QUILT_SHA256: a540ed782849c6f175eabc8551a5c365bfda1b7a52d836b7f0c7ef05ecccc4eb
        DIFFSTAT_DEB: https://deb.debian.org/debian/pool/main/d/diffstat/diffstat_1.65-1_amd64.deb
        DIFFSTAT_SHA256: 6a8c8f3b34d536dbf54ffd9d016d2aab8080323d10915f164344d9f0515ed418
      run: |
        debs="$HOME/quilt-debs"
        works() { command -v quilt >/dev/null && quilt --version >/dev/null 2>&1; }
        # quilt's push/pop/refresh need bash, patch and perl, which the
        # image has; its other Depends (ed, gettext, ...) are optional here.
        install_debs() {
          sudo dpkg -i --force-depends "$debs"/*.deb >/dev/null 2>&1 && works
        }
        fetch_pinned() {
          [ "$RUNNER_ARCH" = X64 ] || return 1
          mkdir -p "$debs" && rm -f "$debs"/*.deb
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 --max-time 60 \
            -o "$debs/quilt.deb" "$QUILT_DEB" &&
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 --max-time 60 \
            -o "$debs/diffstat.deb" "$DIFFSTAT_DEB" &&
          echo "$QUILT_SHA256  $debs/quilt.deb" | sha256sum -c --quiet &&
          echo "$DIFFSTAT_SHA256  $debs/diffstat.deb" | sha256sum -c --quiet
        }
        if works; then
          echo "quilt is already installed"
        elif compgen -G "$debs/*.deb" >/dev/null && install_debs; then
          echo "quilt installed from the cached packages"
        elif fetch_pinned && install_debs; then
          echo "quilt installed from the pinned Debian packages"
        else
          echo "::warning::No cached or pinned quilt; trying apt"
          rm -f "$debs"/*.deb
          for delay in 0 20 40; do
            [ "$delay" = 0 ] || sleep "$delay"
            if timeout 60 sudo apt-get -o Acquire::Retries=2 install -y -qq --no-install-recommends quilt ||
               { timeout 60 sudo apt-get -o Acquire::Retries=2 update -qq &&
                 timeout 60 sudo apt-get -o Acquire::Retries=2 install -y -qq --no-install-recommends quilt; }; then
              break
            fi
          done
          works || { echo "::error::Could not install quilt from the cache, Debian's CDN or Ubuntu's mirrors"; exit 1; }
          echo "quilt installed from apt"
        fi
        quilt --version
        # worktree.sh wants Homebrew's greadlink; GNU readlink is the same tool.
        mkdir -p "$RUNNER_TEMP/bin"
        ln -s "$(command -v readlink)" "$RUNNER_TEMP/bin/greadlink"
        echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
    - name: Fetch GRIT, which the name-pass tests read
      # Only tools/grit is needed, not a Chromium tree. If Google's mirror is
      # down the GRIT tests skip instead of blocking the pull request.
      run: |
        version=$(cat helium-chromium/chromium_version.txt)
        if curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 \
            -o "$RUNNER_TEMP/grit.tar.gz" \
            "https://chromium.googlesource.com/chromium/src/+archive/$version/tools/grit.tar.gz"; then
          mkdir -p build/src/tools/grit
          tar -xzf "$RUNNER_TEMP/grit.tar.gz" -C build/src/tools/grit
        else
          echo "::warning::Could not fetch tools/grit; the GRIT tests will be skipped"
        fi
    - name: Run the tests
      run: |
        set -o pipefail
        python3 -m unittest discover -s devutils/rac -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/tests.log"
        # devutils/rac/evals isn't a package, so the discover above skips it.
        python3 -I -m unittest discover -s devutils/rac/evals -t devutils/rac/evals -p 'test_*.py' -v 2>&1 | tee -a "$RUNNER_TEMP/tests.log"
    - name: Summarize the tests
      if: always()
      run: |
        {
          echo '## Python tests'
          echo
          grep -E '^(Ran |OK|FAILED)' "$RUNNER_TEMP/tests.log" | sed 's/^/- /'
          echo
          echo '<details><summary>Skipped tests</summary>'
          echo
          grep -E ' skipped ' "$RUNNER_TEMP/tests.log" | sed 's/^/- /' || true
          echo
          echo '</details>'
        } >> "$GITHUB_STEP_SUMMARY"

  series:
    name: Patch series
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
        persist-credentials: false
    - uses: actions/setup-python@v6
      with:
        python-version: '3.14'
    - name: Check rac's patches against the series (he validate series)
      # devutils/check_patch_files.sh minus its macOS-only greadlink.
      run: python3 helium-chromium/devutils/check_patch_files.py -p patches
    - name: Check the merged series (no duplicates, rac last)
      run: python3 -I devutils/rac/patch_surface.py files -o /dev/null
    - name: Check that no patch names a file with a space or quotes
      # Apple's patch, which the release build uses, can't apply those
      # (https://github.com/notkainoa/rac/issues/74).
      run: python3 -I devutils/rac/patch_header_lint.py

  patch-apply:
    name: Patches apply without fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
        persist-credentials: false
    - uses: actions/setup-python@v6
      with:
        python-version: '3.14'
    - name: List the files the patches modify
      id: files
      run: |
        mkdir -p build
        python3 -I devutils/rac/patch_surface.py files -o build/pristine-files.txt
        echo "version=$(cat helium-chromium/chromium_version.txt)" >> "$GITHUB_OUTPUT"
    # The pristine files are about 50 MB and change only with Chromium, Helium's
    # downloads, or the list above, so most runs skip the 2 GB download.
    - name: Restore the pristine files
      id: pristine
      uses: actions/cache/restore@v5
      with:
        path: build/pristine
        key: pristine-v1-${{ steps.files.outputs.version }}-${{ hashFiles('build/pristine-files.txt', 'helium-chromium/downloads.ini', 'helium-chromium/deps.ini', 'downloads.ini') }}
    - name: Extract the pristine files from Chromium's source archive
      if: steps.pristine.outputs.cache-hit != 'true'
      env:
        CHROMIUM_VERSION: ${{ steps.files.outputs.version }}
      run: |
        python3 -I devutils/rac/patch_surface.py extract \
          --list build/pristine-files.txt --out build/pristine \
          --version "$CHROMIUM_VERSION"
    - name: Save the pristine files
      if: steps.pristine.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: build/pristine
        key: ${{ steps.pristine.outputs.cache-primary-key }}
    - name: Apply Helium's, then helium-macos's, then rac's patches
      # rac's patches apply with --fuzz=0. A failed hunk, or a hunk that needs
      # fuzz anywhere in the stack, fails the job. The report, with the patch
      # surface, goes to the job summary.
      run: python3 -I devutils/rac/patch_surface.py apply --pristine build/pristine

  apple-patch-apply:
    name: Patches apply with Apple's patch
    # The release build applies every patch with macOS's /usr/bin/patch
    # (helium-chromium/utils/patches.py), which reads file names differently
    # from the GNU patch and quilt used everywhere else.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
        persist-credentials: false
    - uses: actions/setup-python@v6
      with:
        python-version: '3.14'
    - name: List the files the patches modify
      id: files
      run: |
        mkdir -p build
        python3 -I devutils/rac/patch_surface.py files -o build/pristine-files.txt
        echo "version=$(cat helium-chromium/chromium_version.txt)" >> "$GITHUB_OUTPUT"
    # The same files as the job above, cached under their own key: a cache
    # saved on Linux isn't guaranteed to restore on macOS. Most runs still skip
    # the 2 GB download.
    - name: Restore the pristine files
      id: pristine
      uses: actions/cache/restore@v5
      with:
        path: build/pristine
        key: pristine-v1-${{ runner.os }}-${{ steps.files.outputs.version }}-${{ hashFiles('build/pristine-files.txt', 'helium-chromium/downloads.ini', 'helium-chromium/deps.ini', 'downloads.ini') }}
    - name: Extract the pristine files from Chromium's source archive
      if: steps.pristine.outputs.cache-hit != 'true'
      env:
        CHROMIUM_VERSION: ${{ steps.files.outputs.version }}
      run: |
        python3 -I devutils/rac/patch_surface.py extract \
          --list build/pristine-files.txt --out build/pristine \
          --version "$CHROMIUM_VERSION"
    - name: Save the pristine files
      if: steps.pristine.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: build/pristine
        key: ${{ steps.pristine.outputs.cache-primary-key }}
    - name: Apply every patch as the release build does
      # /usr/bin/patch with patches.py's exact flags. A reject, a non-zero
      # exit, or a file written under another name fails the job.
      run: python3 -I devutils/rac/patch_surface.py apply --pristine build/pristine --apple-patch
